[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-of-vibe"
version = "0.1.0"
description = "Chinese and English progress narration for Codex and Kimi CLI"
requires-python = ">=3.11"
dependencies = ["sherpa-onnx>=1.13.8,<2", "pygame>=2.6,<3", "praat-parselmouth>=0.4.6,<0.5", "soundfile>=0.13,<0.14", "pystray>=0.19.5,<0.20", "pillow>=11,<13"]

[project.optional-dependencies]
legacy-online = ["edge-tts>=7.2,<8"]
windows-build = ["pyinstaller>=6.16,<7"]

[project.scripts]
sound-of-vibe = "sound_of_vibe.cli:main"

[project.gui-scripts]
sound-of-vibe-tray = "sound_of_vibe.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sound_of_vibe = ["assets/*"]
